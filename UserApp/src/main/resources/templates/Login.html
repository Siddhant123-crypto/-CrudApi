<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#4facfe,#00f2fe);

        }

        .container{

            width:400px;
            background:#fff;
            padding:35px;
            border-radius:15px;
            box-shadow:0px 10px 25px rgba(0,0,0,0.2);

        }

        h2{

            text-align:center;
            color:#333;
            margin-bottom:25px;

        }

        .input-group{

            margin-bottom:20px;

        }

        label{

            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;

        }

        input{

            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
            outline:none;
            transition:.3s;

        }

        input:focus{

            border-color:#2196F3;
            box-shadow:0 0 5px rgba(33,150,243,.4);

        }

        button{

            width:100%;
            padding:13px;
            border:none;
            border-radius:8px;
            background:#2196F3;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.3s;

        }

        button:hover{

            background:#1976D2;

        }

        #message{

            margin-top:18px;
            text-align:center;
            font-weight:bold;

        }

        .register-link{

            margin-top:20px;
            text-align:center;
            color:#555;

        }

        .register-link a{

            color:#2196F3;
            text-decoration:none;
            font-weight:bold;

        }

        .register-link a:hover{

            text-decoration:underline;

        }

    </style>

</head>

<body>

<div class="container">

    <h2>User Login</h2>

    <div class="input-group">

        <label>Email</label>
        <input type="email"
               id="email"
               placeholder="Enter Email">

    </div>

    <div class="input-group">

        <label>Password</label>
        <input type="password"
               id="password"
               placeholder="Enter Password">

    </div>

    <button onclick="loginUser()">

        Login

    </button>

    <div id="message"></div>

    <div class="register-link">

        Don't have an account?
        <a href="/register">Register Here</a>

    </div>

</div>

<script>

    async function loginUser(){

        const user = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        try{

            const response = await fetch("/user/login",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(user)

            });

            const result = await response.text();

            if (result.startsWith("Login Successful")) {
                window.location.href = "/home";
            } else {
                document.getElementById("message").innerHTML = result;
            }
        }catch(error){

            document.getElementById("message").innerHTML = "Server Error";
            document.getElementById("message").style.color = "red";

        }

    }

</script>
</body>
</html>
