spring.application.name=userapp
server.address=0.0.0.0
server.port=8080
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/userapp
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
file.upload-dir=D:/spring boot/UserApp/UserApp/uploads/
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=-1
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/farm2home
# Google OAuth Client ID (Replace with your actual Web Client ID)
google.client-id=159078840279-7slmnqaleckksrrtr1i35lfnqj0g23v0.apps.googleusercontent.com
server.error.include-message=always
# Security Secrets
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=farm2home-order-group
spring.kafka.consumer.auto-offset-reset=earliest

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.route.enabled=false
farm2home.commission.percent=5
farm2home.payment.pending-timeout-minutes=30
farm2home.payment.cleanup-interval-ms=300000

# Gmail Configuration for Forgot Password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password Reset Deep Link & Web Fallback URL
app.reset-password.deep-link-scheme=farm2home://reset-password
app.reset-password.web-fallback-url=http://172.16.21.145:8080/user/reset-password-page
app.reset-password.token-validity-minutes=60


