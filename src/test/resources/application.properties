spring.application.name=userapp
server.address=0.0.0.0
server.port=8080

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test_password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

file.upload-dir=target/test-uploads/
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-swallow-size=-1
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/farm2home
# Google OAuth Client ID (Replace with your actual Web Client ID)
google.client-id=159078840279-7slmnqaleckksrrtr1i35lfnqj0g23v0.apps.googleusercontent.com
server.error.include-message=always
# Security Secrets
jwt.secret=this_is_a_test_jwt_secret_which_is_at_least_32_characters_long
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=farm2home-order-group
spring.kafka.consumer.auto-offset-reset=earliest

# Razorpay Configuration
razorpay.key.id=test_key_id
razorpay.key.secret=test_key_secret
razorpay.webhook.secret=test_webhook_secret
razorpay.route.enabled=false
farm2home.commission.percent=5
farm2home.payment.pending-timeout-minutes=30
farm2home.payment.cleanup-interval-ms=300000
